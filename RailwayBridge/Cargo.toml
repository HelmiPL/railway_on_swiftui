[package]
name = "railway-bridge"
description = "C ABI bridge exposing the Railway backend (railway-api) to the SwiftUI app"
version = "0.1.0"
license = "GPL-3.0-or-later"
edition = "2024"
publish = false

[lib]
name = "railway_bridge"
crate-type = ["staticlib"]

[dependencies]
rcore = { package = "railway-core", version = "0.3.0", features = ["reqwest-requester", "rt-multi-thread", "serde"] }
rapi = { package = "railway-api", version = "0.3.0", features = ["rt-multi-thread"] }

tokio = { version = "1.52.2", features = ["rt", "rt-multi-thread", "time"] }
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10"
once_cell = "1.21.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.dev]
# The providers do a lot of JSON work; keep debug builds responsive.
opt-level = 1
panic = "abort"
